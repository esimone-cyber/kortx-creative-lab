# Runs on every push to main that touches supabase/.
# 1) Runs any NEW or CHANGED .sql file in supabase/sql/ against the database (our scripts are safe to re-run).
# 2) Redeploys every Edge Function in supabase/functions/.
# Needs three GitHub repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_URL.
name: Supabase auto-update
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Run new or changed SQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(ls supabase/sql/*.sql 2>/dev/null | sort)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'supabase/sql/*.sql' | sort)
          fi
          for f in $FILES; do echo "▶ $f"; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; done
          psql "$SUPABASE_DB_URL" -c "notify pgrst, 'reload schema';"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
