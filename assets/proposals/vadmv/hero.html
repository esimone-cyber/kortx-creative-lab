<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virginia DMV · Eyes off the road</title>
<style>
  html, body { margin: 0; height: 100%; background: #000509; overflow: hidden; font-family: Inter, Helvetica, Arial, sans-serif; }
  svg { display: block; width: 100%; height: 100%; }
  .glow { filter: drop-shadow(0 0 6px rgba(0,204,255,.55)) drop-shadow(0 0 18px rgba(0,204,255,.25)); }
  .soft { filter: drop-shadow(0 0 4px rgba(0,204,255,.4)); }
  .dash { stroke-dasharray: 26 34; animation: road 1.1s linear infinite; }
  @keyframes road { to { stroke-dashoffset: -60; } }
  .sight { stroke-dasharray: 6 8; animation: sight 1.6s linear infinite; }
  @keyframes sight { to { stroke-dashoffset: -28; } }
  .bubble { opacity: 0; transform-box: fill-box; transform-origin: 0% 50%; animation: pop 6s cubic-bezier(.16,1,.3,1) infinite; }
  .b2 { animation-delay: .7s; } .b3 { animation-delay: 1.4s; }
  @keyframes pop { 0%, 4% { opacity: 0; transform: translateY(10px) scale(.92); } 12%, 78% { opacity: 1; transform: none; } 88%, 100% { opacity: 0; transform: translateY(-6px); } }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes ping { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.4); } }
  .wave { opacity: 0; animation: wave 2s ease-out infinite; } .w2 { animation-delay: .35s; }
  @keyframes wave { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .car { animation: drift 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes drift { 0%, 100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(-14px) rotate(-1.2deg); } }
  .float { animation: float 8s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .timer { font-size: 13px; font-weight: 700; letter-spacing: .14em; fill: #66E0FF; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .18em; fill: rgba(255,255,255,.55); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bubble { opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A driver's phone lights up with messages while their car drifts in its lane">
  <defs>
    <radialGradient id="bloom" cx="62%" cy="58%" r="55%">
      <stop offset="0" stop-color="#00CCFF" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#6D5EF0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000509" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00CCFF" stop-opacity="0"/>
      <stop offset=".35" stop-color="#00CCFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00CCFF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2236" stop-opacity=".95"/>
      <stop offset="1" stop-color="#061624" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="rgba(255,255,255,.035)"/></pattern>
  </defs>

  <rect width="1600" height="900" fill="#000509"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#bloom)"/>

  <!-- horizon + road in perspective -->
  <line x1="0" y1="430" x2="1600" y2="430" stroke="rgba(0,204,255,.18)" stroke-dasharray="3 9"/>
  <g class="glow">
    <path d="M760 430 L300 900" stroke="url(#roadFade)" stroke-width="3" fill="none"/>
    <path d="M840 430 L1420 900" stroke="url(#roadFade)" stroke-width="3" fill="none"/>
  </g>
  <path class="dash" d="M800 430 L860 900" stroke="rgba(0,204,255,.75)" stroke-width="4" fill="none"/>
  <path d="M780 430 L560 900 M820 430 L1150 900" stroke="rgba(0,204,255,.12)" stroke-width="1.5" fill="none"/>

  <!-- car, from behind -->
  <g class="car">
    <g class="glow" fill="none" stroke="#33D6FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(820 600)">
      <path d="M-170 140 V70 Q-170 40 -140 32 L-112 -40 Q-104 -62 -80 -64 H80 Q104 -62 112 -40 L140 32 Q170 40 170 70 V140" fill="url(#glass)"/>
      <path d="M-96 -36 Q-90 -50 -74 -50 H74 Q90 -50 96 -36 L116 24 H-116 Z" stroke-width="2.5" stroke="rgba(51,214,255,.8)"/>
      <path d="M-170 140 H-118 V176 Q-118 186 -128 186 H-160 Q-170 186 -170 176 Z"/>
      <path d="M170 140 H118 V176 Q118 186 128 186 H160 Q170 186 170 176 Z"/>
      <path d="M-170 140 H170"/>
      <rect x="-156" y="58" width="56" height="22" rx="8" stroke="#FF6B8A" stroke-width="3"/>
      <rect x="100" y="58" width="56" height="22" rx="8" stroke="#FF6B8A" stroke-width="3"/>
      <rect x="-44" y="92" width="88" height="26" rx="5" stroke-width="2.5"/>
      <!-- driver silhouette, head turned down toward the phone -->
      <path d="M-30 20 Q-30 -22 0 -24 Q26 -22 28 8" stroke-width="2.5" stroke="rgba(51,214,255,.7)"/>
    </g>
  </g>
  <g opacity=".55" filter="blur(8px)"><ellipse cx="664" cy="770" rx="40" ry="12" fill="#FF6B8A"/><ellipse cx="976" cy="770" rx="40" ry="12" fill="#FF6B8A"/></g>

  <!-- sightline: driver's eyes up to the phone, not the road -->
  <path class="sight" d="M820 586 C 814 556, 810 460, 806 430" stroke="rgba(255,255,255,.55)" stroke-width="2" fill="none"/>
  <circle cx="820" cy="586" r="5" fill="#fff" class="soft"/>

  <!-- phone, smaller, floating above the car -->
  <g class="float">
    <g transform="translate(741 236) scale(.56)">
      <rect x="0" y="0" width="190" height="340" rx="30" fill="url(#glass)" stroke="#33D6FF" stroke-width="5" class="glow"/>
      <rect x="70" y="16" width="50" height="8" rx="4" fill="#33D6FF" opacity=".8"/>
      <g class="bubble"><rect x="20" y="60" width="132" height="38" rx="19" fill="rgba(0,204,255,.16)" stroke="#33D6FF" stroke-width="2.5"/><rect x="38" y="75" width="80" height="8" rx="4" fill="#9CEBFF"/></g>
      <g class="bubble b2"><rect x="38" y="112" width="132" height="38" rx="19" fill="rgba(109,94,240,.22)" stroke="#8A7CF8" stroke-width="2.5"/><rect x="56" y="127" width="96" height="8" rx="4" fill="#C9C1FF"/></g>
      <g class="bubble b3"><rect x="20" y="164" width="110" height="38" rx="19" fill="rgba(0,204,255,.16)" stroke="#33D6FF" stroke-width="2.5"/><rect x="38" y="179" width="60" height="8" rx="4" fill="#9CEBFF"/></g>
      <g fill="none" stroke="#33D6FF" stroke-width="4" stroke-linecap="round">
        <path class="wave" d="M-22 120 Q-44 150 -22 180"/>
        <path class="wave w2" d="M-44 104 Q-78 150 -44 196"/>
      </g>
    </g>
    <!-- warning: red exclamation badge on the phone's corner -->
    <g transform="translate(855 238)">
      <circle r="30" fill="none" stroke="#FF4D6D" stroke-width="3" class="ping"/>
      <circle r="24" fill="#FF3B5C" style="filter: drop-shadow(0 0 10px rgba(255,59,92,.85)) drop-shadow(0 0 26px rgba(255,59,92,.45));"/>
      <rect x="-3.5" y="-14" width="7" height="17" rx="3.5" fill="#fff"/>
      <circle cy="10" r="4" fill="#fff"/>
    </g>
  </g>
</svg>
</body>
</html>
