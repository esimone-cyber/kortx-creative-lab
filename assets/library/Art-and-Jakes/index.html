<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=300,height=600">
<title>Art &amp; Jakes — 300x600</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #ad{position:relative;width:300px;height:600px;overflow:hidden;background:#08132a;display:block;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  #ad img{position:absolute;display:block;border:0;-webkit-user-select:none;user-select:none;}
  .scene{position:absolute;inset:0;width:300px;height:600px;will-change:transform;}
  .bg{left:0;top:0;width:300px;height:600px;}

  #s1{z-index:6;animation:s1intro 12s linear 1 both, s1 12s linear 12s infinite forwards;}
  #s2{z-index:2;animation:s2 12s linear infinite both;}
  #s3{z-index:3;animation:s3intro 12s linear 1 both, s3 12s linear 12s infinite forwards;}

  #headline{left:26px;top:123px;width:245px;animation:hl 12s linear infinite both;}
  #mask1{left:0;top:0;width:300px;height:600px;-webkit-clip-path:inset(297px 0 0 0);clip-path:inset(297px 0 0 0);}

  .pop{position:absolute;transform-origin:50% 50%;}
  .pop img{left:0;top:0;width:100%;height:100%;}
  #beer{left:-2px;top:20px;width:70px;height:93px;animation:popA 12s linear infinite both;}
  #beer img{transform:rotate(-6deg);}
  #wing{left:236px;top:7px;width:59px;height:59px;animation:popB 12s linear infinite both;}
  #wing img{transform:rotate(25deg);}
  #finger{left:229px;top:60px;width:47px;height:57px;animation:popC 12s linear infinite both;}
  #finger img{transform:rotate(12deg);}
  #phone{left:-8px;top:140px;width:196px;height:294px;animation:phinintro 12s linear 1 both, phin 12s linear 12s infinite forwards;}

  @keyframes s1{
    0%{transform:translateX(100%);z-index:6;animation-timing-function:cubic-bezier(.22,1,.36,1);}
    5%,31.9%{transform:translateX(0);z-index:6;}
    32%,100%{transform:translateX(0);z-index:1;}
  }
  @keyframes s1intro{
    0%,31.9%{transform:translateX(0);z-index:6;}
    32%,100%{transform:translateX(0);z-index:1;}
  }
  @keyframes s3intro{
    0%,66.7%{transform:translateX(-100%);animation-timing-function:cubic-bezier(.22,1,.36,1);}
    71.7%,100%{transform:translateX(0);}
  }
  @keyframes phinintro{
    0%,72.5%{transform:translateX(-290px);opacity:0;animation-timing-function:cubic-bezier(.28,1.5,.6,1);}
    74.5%{opacity:1;}
    80%,100%{transform:translateX(0);opacity:1;}
  }
  @keyframes s2{
    0%,33.3%{transform:translateX(100%);animation-timing-function:cubic-bezier(.22,1,.36,1);}
    38.3%,100%{transform:translateX(0);}
  }
  @keyframes s3{
    0%,6%{transform:translateX(0);}
    6.01%,66.7%{transform:translateX(-100%);animation-timing-function:cubic-bezier(.22,1,.36,1);}
    71.7%,100%{transform:translateX(0);}
  }
  @keyframes hl{
    0%,3.3%{transform:translateY(185px);animation-timing-function:cubic-bezier(.34,1.56,.64,1);}
    12.5%,100%{transform:translateY(0);}
  }
  @keyframes popA{
    0%,39.2%{transform:scale(.3);opacity:0;animation-timing-function:cubic-bezier(.34,1.7,.64,1);}
    41.5%{opacity:1;}
    44.5%,100%{transform:scale(1);opacity:1;}
  }
  @keyframes popB{
    0%,40.8%{transform:scale(.3);opacity:0;animation-timing-function:cubic-bezier(.34,1.7,.64,1);}
    43.1%{opacity:1;}
    46.1%,100%{transform:scale(1);opacity:1;}
  }
  @keyframes popC{
    0%,42.5%{transform:scale(.3);opacity:0;animation-timing-function:cubic-bezier(.34,1.7,.64,1);}
    44.8%{opacity:1;}
    47.8%,100%{transform:scale(1);opacity:1;}
  }
  @keyframes phin{
    0%,6%{transform:translateX(0);opacity:1;}
    6.01%,72.5%{transform:translateX(-290px);opacity:0;animation-timing-function:cubic-bezier(.28,1.5,.6,1);}
    74.5%{opacity:1;}
    80%,100%{transform:translateX(0);opacity:1;}
  }
</style>
</head>
<body>
<a id="ad" href="https://order.online/business/art--jakes-sports-bar--grill-107916" target="_blank" rel="noopener">
  <div class="scene" id="s3">
    <img class="bg" src="img/bg3.jpg" alt="">
    <div class="pop" id="phone"><img src="img/phone.png" alt=""></div>
    <img src="img/cta-learn-more.png" alt="LEARN MORE" style="left:88.5px;top:523px;width:106px;height:24px;">
  </div>
  <div class="scene" id="s2">
    <img class="bg" src="img/bg2.jpg" alt="">
    <div class="pop" id="beer"><img src="img/beer.png" alt=""></div>
    <div class="pop" id="wing"><img src="img/wing.png" alt=""></div>
    <div class="pop" id="finger"><img src="img/finger.png" alt=""></div>
    <img src="img/cta-learn-more.png" alt="LEARN MORE" style="left:86px;top:529px;width:120px;height:26px;">
  </div>
  <div class="scene" id="s1">
    <img class="bg" src="img/bg1.jpg" alt="">
    <img id="headline" src="img/headline.png" alt="Your spot for the next game">
    <img class="bg" id="mask1" src="img/bg1.jpg" alt="">
    <img src="img/cta-learn-more.png" alt="LEARN MORE" style="left:79px;top:474px;width:130px;height:32px;">
  </div>
</a>
<script>
var clickTag = "https://order.online/business/art--jakes-sports-bar--grill-107916";

  if (window.Celtra && window.Celtra.clickthrough) { e.preventDefault(); window.Celtra.clickthrough(); }
});
</script>
</body>
</html>
