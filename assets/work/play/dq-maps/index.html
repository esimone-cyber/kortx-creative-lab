<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="ad.size" content="width=300,height=600"><title>Dairy Queen • Find Locations</title><link rel="stylesheet" href="style.css"></head>
<body><main id="ad" aria-label="Dairy Queen Signature Stackburgers advertisement">
<section id="hero" aria-label="Signature Stackburgers">
<div class="art" aria-hidden="true"><div class="tiles"></div><div class="food f1"></div><div class="food f2"></div><div class="food f3"></div><div class="food f4"></div><div class="food f5"></div></div>
<img class="headline" src="assets/headline.png" alt="New Signature Stackburgers"><img class="brand" src="assets/logo.png" alt="Dairy Queen">
<a id="mainClickout" class="clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Visit Dairy Queen"></a>
<button id="find" aria-label="Find Dairy Queen locations" aria-controls="locator" aria-expanded="false"><span>FIND LOCATIONS</span><img src="assets/plus.png" alt=""></button>
</section>
<section id="locator" aria-label="Dairy Queen list view" hidden>
<img class="list-image" src="assets/list-view.png" alt="Dairy Queen locations list: Walton Village Plaza, Baldwin Avenue, Baldwin Road, North Main Street and South Lapeer Road.">
<a class="list-logo clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Visit Dairy Queen"></a>
<button id="back" class="list-bar" aria-label="Back to advertisement"><span class="back-arrow" aria-hidden="true"></span><span>List view</span></button>
<a class="list-row row1 clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Dairy Queen — Walton Village Plaza"></a>
<a class="list-row row2 clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Dairy Queen Store — Baldwin Avenue"></a>
<a class="list-row row3 clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Dairy Queen Treat — Baldwin Road"></a>
<a class="list-row row4 clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Dairy Queen Store — North Main Street"></a>
<a class="list-row row5 clickout" href="https://www.dairyqueen.com/" target="_blank" rel="noopener" aria-label="Dairy Queen Treat — South Lapeer Road"></a>
</section>
</main><script src="config.js"></script><script src="unit.js"></script></body></html>
