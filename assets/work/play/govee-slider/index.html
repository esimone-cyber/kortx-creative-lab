<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Govee Envisual TV Backlight T2 | The Dream View</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #fff; }
    .ad { position: relative; isolation: isolate; width: 300px; height: 600px; overflow: hidden; color: #fff; background: #11131f; --split: 50%; }
    .top-link { position: absolute; z-index: 4; inset: 0 0 auto; height: 147px; text-align: center; text-decoration: none; color: inherit; }
    .logo { display: block; width: 117px; height: auto; margin: 17px auto 9px; animation: entrance .65s .1s both; }
    h1 { margin: 0; font-size: 30px; line-height: 1.08; letter-spacing: -.9px; font-weight: 700; animation: entrance .7s .28s both; }
    .product { margin: 7px 0 0; color: #d8d0e6; font-size: 10px; line-height: 1.2; letter-spacing: 1.45px; text-transform: uppercase; animation: entrance .7s .43s both; }
    .stage { position: absolute; z-index: 1; inset: 0; width: 300px; height: 600px; overflow: hidden; touch-action: none; cursor: ew-resize; outline: none; }
    .stage:focus-visible { outline: 2px solid #75e3ff; outline-offset: -3px; }
    .scene { position: absolute; inset: 0; width: 100%; height: 100%; background-position: center; background-size: 300px 600px; background-repeat: no-repeat; pointer-events: none; }
    .before { background-image: url('assets/room-before.webp'); }
    .after { background-image: url('assets/room-after.webp'); clip-path: inset(0 calc(100% - var(--split)) 0 0); }
    .scene-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, #10121b85 0%, #10121b45 18%, transparent 31%, transparent 55%, #120e2040 68%, #0c0c1add 84%, #0c0c1af2 100%); }
    .state-label { position: absolute; z-index: 2; top: 335px; left: 50%; transform: translateX(-50%); color: #eee8f5; font-size: 12px; font-weight: 300; letter-spacing: 2.3px; text-shadow: 0 1px 8px #000; pointer-events: none; }
    .divider { position: absolute; z-index: 6; top: 0; bottom: 0; left: var(--split); width: 1px; background: #ffffffd9; box-shadow: 0 0 2px #fff8; pointer-events: none; }
    .handle { position: absolute; top: 52%; left: .5px; width: 20px; height: 20px; transform: translate(-50%,-50%); border: 1px solid #c9c8c8; border-radius: 50%; background: #fff; box-shadow: 0 1px 7px #0007; }
    .hint { position: absolute; z-index: 2; left: 0; right: 0; top: 370px; text-align: center; color: #fff; font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 1px 7px #000; pointer-events: none; transition: opacity .32s; }
    .ad.ready .hint, .ad.interacted .hint { opacity: 0; }
    .features { position: absolute; z-index: 3; left: 7px; right: 7px; bottom: 145px; display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; pointer-events: none; }
    .feature { display: flex; align-items: center; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(20px) scale(.7); transition: opacity .33s ease, transform .5s cubic-bezier(.18,1.45,.5,1); }
    .feature img { width: 58px; height: 58px; flex: none; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 12px #000b; }
    .feature span { color: #fff; font-size: 8px; line-height: 1.15; text-align: center; text-shadow: 0 1px 5px #000; white-space: nowrap; }
    .ad.revealed .feature { opacity: 1; transform: translateY(0) scale(1); }
    .ad.revealed .feature:nth-child(2) { transition-delay: .1s; }
    .ad.revealed .feature:nth-child(3) { transition-delay: .2s; }
    .bottom { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 120px; display: flex; flex-direction: column; align-items: center; padding-top: 1px; pointer-events: none; }
    .cta { display: flex; align-items: center; justify-content: center; width: 218px; height: 42px; flex: none; border-radius: 100px; color: #14111e; background: #fff; text-decoration: none; text-transform: uppercase; font-size: 13px; font-weight: 800; letter-spacing: 1.35px; box-shadow: 0 6px 20px #06051072; transition: background .2s, transform .2s, box-shadow .2s; animation: entrance .7s 1s both; pointer-events: auto; }
    .available { margin-top: 8px; font-size: 8px; line-height: 1; letter-spacing: 1.1px; text-transform: uppercase; color: #d2cdda; }
    .retailers { display: flex; align-items: center; justify-content: space-between; width: 278px; height: 31px; margin-top: 6px; }
    .retailers img { display: block; width: auto; max-width: 50px; max-height: 22px; object-fit: contain; }
    .retailers img:nth-child(2) { max-height: 25px; }
    .retailers img:nth-child(3), .retailers img:nth-child(6) { max-height: 26px; }
    .cta:hover, .cta:focus-visible { background: #29b6e2; transform: translateY(-2px); box-shadow: 0 7px 19px #17a2d24a; outline: none; }
    @keyframes entrance { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="ad" id="ad" aria-label="Govee Envisual TV Backlight T2 advertisement">
    <a class="top-link clickout" href="https://us.govee.com/products/govee-envisual-tv-backlight-t2?variant=45351539146937&amp;utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=PLA-US-All-220412&amp;gad_source=1&amp;gad_campaignid=16876523425&amp;gbraid=0AAAAABQ7EBQ4fy75s2OAjDptbtEygEefM&amp;gclid=Cj0KCQjw8c3VBhCsARIsAA_xJ92LdqhIJrW-yfPRHqY_4xpN7jxLUPMYtLr6d7ISGSUZVy6BOO03gcIaAs8aEALw_wcB" target="_blank" rel="noopener noreferrer" aria-label="Shop Govee Envisual TV Backlight T2">
      <img class="logo" src="assets/govee-logo.png" alt="Govee">
      <h1>The Dream View</h1>
      <p class="product">Envisual TV Backlight T2</p>
    </a>
    <div class="stage" id="stage" role="slider" tabindex="0" aria-label="Reveal TV backlighting, before and after" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50 percent of room with backlighting" aria-orientation="horizontal">
      <div class="scene before"></div>
      <div class="scene after"></div>
      <div class="scene-shade"></div>
      <span class="state-label" id="stateLabel">Before</span>
      <div class="hint">Drag to reveal</div>
      <div class="features" aria-hidden="true">
        <div class="feature"><img src="assets/feature-1.webp" alt=""><span>60 LEDs / Meter</span></div>
        <div class="feature"><img src="assets/feature-2.webp" alt=""><span>12mm Wide</span></div>
        <div class="feature"><img src="assets/feature-3.webp" alt=""><span>One IC Every 3 Beads</span></div>
      </div>
    </div>
    <div class="bottom">
      <a class="cta clickout" href="https://us.govee.com/products/govee-envisual-tv-backlight-t2?variant=45351539146937&amp;utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=PLA-US-All-220412&amp;gad_source=1&amp;gad_campaignid=16876523425&amp;gbraid=0AAAAABQ7EBQ4fy75s2OAjDptbtEygEefM&amp;gclid=Cj0KCQjw8c3VBhCsARIsAA_xJ92LdqhIJrW-yfPRHqY_4xpN7jxLUPMYtLr6d7ISGSUZVy6BOO03gcIaAs8aEALw_wcB" target="_blank" rel="noopener noreferrer">Shop Now</a>
      <span class="available">Available at</span>
      <div class="retailers" aria-label="Available at Walmart, Target, Sam's Club, Lowe's, Best Buy, and The Home Depot">
        <img src="assets/walmart.png" alt="Walmart"><img src="assets/target.png" alt="Target"><img src="assets/sams.png" alt="Sam's Club"><img src="assets/lowes.png" alt="Lowe's"><img src="assets/bestbuy.png" alt="Best Buy"><img src="assets/homedepot.png" alt="The Home Depot">
      </div>
    </div>
    <div class="divider" aria-hidden="true"><div class="handle"></div></div>
  </main>
  <script>
    (() => {
      const ad = document.getElementById('ad');
      const stage = document.getElementById('stage');
      const stateLabel = document.getElementById('stateLabel');
      const defaultUrl = document.querySelector('.cta').href;
      // The hosting ad platform can override the destination with window.clickTag.
      document.querySelectorAll('.clickout').forEach(link => {
        link.addEventListener('click', event => {
          if (window.clickTag && window.clickTag !== defaultUrl) {
            event.preventDefault();
            window.open(window.clickTag, '_blank', 'noopener');
          }
        });
      });
      let value = 50;
      let dragging = false;
      let userInteracted = false;
      let frame = 0;
      function setValue(next) {
        value = Math.max(0, Math.min(100, next));
        ad.style.setProperty('--split', value + '%');
        stage.setAttribute('aria-valuenow', String(Math.round(value)));
        stage.setAttribute('aria-valuetext', Math.round(value) + ' percent of room with backlighting');
        stateLabel.textContent = value > 50 ? 'After' : 'Before';
        ad.classList.toggle('revealed', userInteracted && value >= 75);
      }
      function fromPointer(event) {
        const rect = stage.getBoundingClientRect();
        setValue((event.clientX - rect.left) / rect.width * 100);
      }
      stage.addEventListener('pointerdown', event => {
        if (event.button !== 0 && event.pointerType === 'mouse') return;
        cancelAnimationFrame(frame);
        dragging = true;
        userInteracted = true;
        ad.classList.add('interacted');
        stage.setPointerCapture(event.pointerId);
        fromPointer(event);
        stage.focus({preventScroll:true});
      });
      stage.addEventListener('pointermove', event => { if (dragging) fromPointer(event); });
      stage.addEventListener('pointerup', () => { dragging = false; });
      stage.addEventListener('pointercancel', () => { dragging = false; });
      stage.addEventListener('keydown', event => {
        const steps = {ArrowLeft:-5,ArrowDown:-5,ArrowRight:5,ArrowUp:5};
        let next = steps[event.key];
        if (event.key === 'Home') next = -100;
        if (event.key === 'End') next = 100;
        if (next === undefined) return;
        event.preventDefault();
        cancelAnimationFrame(frame);
        userInteracted = true;
        ad.classList.add('interacted');
        setValue(value + next);
      });
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setValue(0); ad.classList.add('ready'); return; }
      const started = performance.now() + 1600;
      function animate(now) {
        if (userInteracted) return;
        const progress = Math.max(0, Math.min(1, (now - started) / 950));
        const eased = progress * progress * (3 - 2 * progress);
        setValue(50 * (1 - eased));
        if (progress < 1) frame = requestAnimationFrame(animate);
        else ad.classList.add('ready');
      }
      frame = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
