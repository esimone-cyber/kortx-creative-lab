<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=300, initial-scale=1">
<meta name="ad.size" content="width=300,height=600">
<title>Harris Health — Care for the entire family</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden}
.ad{position:relative;width:300px;height:600px;overflow:hidden;background:#06334f}
.artwork{display:block;width:300px;height:600px}
.clickout{position:absolute;inset:0;z-index:1}
.maps{position:absolute;left:12px;top:200px;width:276px;height:204px;z-index:2;overflow:hidden;background:#b8c995}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility 0s linear .4s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s ease,visibility 0s}
.screen img{display:block;width:276px;height:204px;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border:0;margin:0;padding:0;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.menu{left:10px;top:10px;width:36px;height:36px;border-radius:50%}
.back{left:0;top:0;width:276px;height:50px}
.row{left:0;width:276px;height:50px}.row-one{top:50px}.row-two{top:100px}.row-three{top:150px}
a:focus-visible,button:focus-visible{outline:2px solid #f6eddd;outline-offset:-3px}
.row:focus-visible{outline-color:#073353}
@media(prefers-reduced-motion:reduce){.screen{transition:none!important}}

.background-motion{position:absolute;left:0;top:0;width:300px;height:432px;overflow:hidden;background:#063b55;pointer-events:none}
.background-motion:before{content:"";position:absolute;inset:-70%;background:linear-gradient(115deg,#082d50 12%,#075369 32%,#087b87 49%,#075369 66%,#082d50 88%);background-size:220% 100%;animation:gradient-sweep 10s ease-in-out infinite alternate;will-change:background-position}
.headline-line{position:absolute;left:0;width:300px;height:34px;overflow:hidden;pointer-events:none}
.headline-line svg{display:block;width:300px;height:34px;overflow:hidden;animation:headline-in 1s cubic-bezier(.16,1,.3,1) both}
.headline-one{top:21px}.headline-two{top:58px}.headline-three{top:96px}
.headline-two svg{animation-delay:.22s}.headline-three svg{animation-delay:.44s}
.cta-art{position:absolute;left:79px;top:141px;width:141px;height:31px;overflow:hidden;border-radius:10px;pointer-events:none}
.cta-art svg{display:block;width:141px;height:31px;overflow:hidden}
@keyframes headline-in{from{opacity:0;transform:translateY(29px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradient-sweep{from{background-position:0% 50%}to{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){.headline-line svg,.background-motion:before{animation:none!important}}
</style>
<script>window.clickTag=window.clickTag||'https://www.harrishealth.org/locations-hh/Pages/default.aspx';</script>
</head>
<body>
<main class="ad" aria-label="Harris Health advertisement">
<img class="artwork" src="assets/brand.png" alt="Care for the entire family. Close to home. Learn more. Harris Health, Est. 1966. 60 years." width="300" height="600">
<div class="background-motion" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="headline-ink" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .9647 0 0 0 0 .9294 0 0 0 0 .8667 1.25 0 0 0 -.2059"/></filter></defs></svg>
<div class="headline-line headline-one" aria-hidden="true"><svg viewBox="0 0 600 68"><image href="assets/brand.png" width="600" height="1200" y="-42" filter="url(#headline-ink)"/></svg></div>
<div class="headline-line headline-two" aria-hidden="true"><svg viewBox="0 0 600 68"><image href="assets/brand.png" width="600" height="1200" y="-116" filter="url(#headline-ink)"/></svg></div>
<div class="headline-line headline-three" aria-hidden="true"><svg viewBox="0 0 600 68"><image href="assets/brand.png" width="600" height="1200" y="-192" filter="url(#headline-ink)"/></svg></div>
<div class="cta-art" aria-hidden="true"><svg viewBox="0 0 282 62"><image href="assets/brand.png" width="600" height="1200" x="-158" y="-282"/></svg></div>
<a class="clickout" data-exit href="https://www.harrishealth.org/locations-hh/Pages/default.aspx" target="_blank" rel="noopener noreferrer" aria-label="Learn more about Harris Health locations"></a>
<section class="maps" aria-label="Harris Health interactive location map">
<div class="screen active" id="map-screen" aria-hidden="false">
<img src="assets/map.png" alt="Map of Harris Health locations" width="276" height="204" draggable="false">
<button class="hotspot menu" id="menu" type="button" aria-label="Open locations menu" aria-controls="list-screen" aria-expanded="false"></button>
</div>
<div class="screen" id="list-screen" aria-hidden="true" inert>
<img src="assets/map-list.png" alt="Harris Health locations: Squatty Lyons Health Center, Baytown Health Center, and Aldine Health Center" width="276" height="204" draggable="false">
<button class="hotspot back" id="back" type="button" aria-label="Go to map" aria-controls="map-screen"></button>
<a class="hotspot row row-one" data-exit href="https://www.harrishealth.org/locations-hh/Pages/default.aspx" target="_blank" rel="noopener noreferrer" aria-label="Learn more: Squatty Lyons Health Center, 1712 First Street E, Suite M20"></a>
<a class="hotspot row row-two" data-exit href="https://www.harrishealth.org/locations-hh/Pages/default.aspx" target="_blank" rel="noopener noreferrer" aria-label="Learn more: Baytown Health Center, 1602 Garth Road, 1103 mi"></a>
<a class="hotspot row row-three" data-exit href="https://www.harrishealth.org/locations-hh/Pages/default.aspx" target="_blank" rel="noopener noreferrer" aria-label="Learn more: Aldine Health Center, 4755 Aldine Mail Route, 1105 mi"></a>
</div>
</section>
</main>
<script>
(function(){
'use strict';
const map=document.getElementById('map-screen');
const list=document.getElementById('list-screen');
const menu=document.getElementById('menu');
const back=document.getElementById('back');
function showList(open,keyboard){
  map.classList.toggle('active',!open);
  list.classList.toggle('active',open);
  map.inert=open;
  list.inert=!open;
  map.setAttribute('aria-hidden',String(open));
  list.setAttribute('aria-hidden',String(!open));
  menu.setAttribute('aria-expanded',String(open));
  if(keyboard)(open?back:menu).focus({preventScroll:true});
}
menu.addEventListener('click',function(event){showList(true,event.detail===0);});
back.addEventListener('click',function(event){showList(false,event.detail===0);});
list.addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();showList(false,true);}});
document.querySelectorAll('[data-exit]').forEach(function(link){
  link.href=window.clickTag;
  link.addEventListener('click',function(){link.href=window.clickTag;});
});
})();
</script>
</body>
</html>
