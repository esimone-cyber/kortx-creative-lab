const INTERVAL=5000;
const photos=document.getElementById('photos');
const details=document.getElementById('details');
document.getElementById('inventory-exit').href=window.clickTag;
inventory.forEach((car,i)=>{
 const link=document.createElement('a');link.className='photo-link'+(i===0?' active':'');link.href=car.url;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label','View '+car.year+' '+car.make+' '+car.model+' '+car.trim);link.tabIndex=i===0?0:-1;link.setAttribute('aria-hidden',String(i!==0));
 const img=document.createElement('img');img.src=car.image;img.alt=car.year+' '+car.make+' '+car.model+' '+car.trim;img.width=800;img.height=600;link.append(img);photos.append(link);
 const copy=document.createElement('div');copy.className='vehicle-copy'+(i===0?' active':'');copy.setAttribute('aria-hidden',String(i!==0));
 const year=document.createElement('p');year.className='year-make';year.textContent=car.year+' '+car.make.toUpperCase();
 const model=document.createElement('h2');model.className='model';model.textContent=car.model;
 const specs=document.createElement('p');specs.className='specs';[car.trim,car.drive,car.body].forEach(v=>{const span=document.createElement('span');span.textContent=v;specs.append(span)});copy.append(year,model,specs);details.append(copy);
});
const links=[...document.querySelectorAll('.photo-link')],copies=[...document.querySelectorAll('.vehicle-copy')],fills=[...document.querySelectorAll('.fill')];
let index=0,elapsed=0,last=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function show(next){index=next;links.forEach((el,i)=>{el.classList.toggle('active',i===index);el.tabIndex=i===index?0:-1;el.setAttribute('aria-hidden',String(i!==index))});copies.forEach((el,i)=>{el.classList.toggle('active',i===index);el.setAttribute('aria-hidden',String(i!==index))});document.getElementById('current').textContent=String(index+1).padStart(2,'0');}
function tick(now){if(!last)last=now;const delta=now-last;last=now;const paused=document.hidden||document.getElementById('ad').contains(document.activeElement);if(!paused){elapsed+=delta;if(elapsed>=INTERVAL){elapsed%=INTERVAL;show((index+1)%inventory.length)}}fills.forEach((el,i)=>{el.style.transform='scaleX('+(i===index?(reduced.matches?1:elapsed/INTERVAL):0)+')'});requestAnimationFrame(tick)}
