<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discount Tire — 300 × 600</title>
  <link rel="stylesheet" href="style.css">
  <script src="unit.js" defer></script>
</head>
<body>
  <main class="ad" aria-label="Discount Tire offers, 200 Brown Road, Auburn Hills">
    <a class="main-link" href="https://www.discounttire.com/" target="_blank" rel="noopener" aria-label="Visit Discount Tire"></a>
    <img class="artwork" src="assets/artwork.png" alt="Discount Tire. Top brands. Right price. Find the right tires and wheels for every drive." width="300" height="600">
    <video class="background-motion" width="300" height="600" autoplay muted loop playsinline preload="auto" poster="assets/motion-poster.png" aria-hidden="true" tabindex="-1">
      <source src="assets/background-motion.mp4" type="video/mp4">
    </video>
    <div class="carousel" aria-roledescription="carousel" aria-label="Tire and wheel offers. Slides change every three seconds. Press Space to pause." tabindex="0">
      <div class="offer active"><img src="assets/pirelli.png" alt="$80 Instant Savings on any set of Pirelli tires. Expires 08/03/2026." width="300" height="600"></div>
      <div class="offer" aria-hidden="true"><img src="assets/method.png" alt="Price Reduction on Select Method Race Wheels. Expires 07/24/2026." width="300" height="600"></div>
      <div class="offer" aria-hidden="true"><img src="assets/artwork.png" alt="$80 Instant Savings on select sets of Goodyear tires. Expires 08/03/2026." width="300" height="600"></div>
    </div>
    <a class="hotspot location" href="https://www.google.com/maps/search/?api=1&query=Discount+Tire+200+Brown+Rd+Auburn+Hills" target="_blank" rel="noopener" aria-label="Directions to Discount Tire, 200 Brown Road, Auburn Hills"></a>
    <a class="hotspot details" href="https://www.discounttire.com/promotions/pirelli-tires" target="_blank" rel="noopener" aria-label="Shop the Pirelli offer"></a>
    <nav class="dots" aria-label="Choose an offer">
      <button class="dot selected" aria-label="Pirelli offer" aria-current="true"></button>
      <button class="dot" aria-label="Method wheels offer"></button>
      <button class="dot" aria-label="Goodyear offer"></button>
    </nav>
    <a class="hotspot shop" href="https://www.discounttire.com/" target="_blank" rel="noopener" aria-label="Shop deals at Discount Tire"></a>
    <a class="hotspot phone" href="tel:+12483931900" aria-label="Call Discount Tire at (248) 393-1900"></a>
  </main>
</body>
</html>
