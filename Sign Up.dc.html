<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="kx-theme.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/kortx-logomark-bright-blue.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up · KORTX Creative Labs</title>
<link rel="preconnect" href="https://fdjfsimjilicmfsiijyi.supabase.co" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="stylesheet" href="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/tokens/fonts.css">
<link rel="stylesheet" href="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/tokens/colors.css">
<link rel="stylesheet" href="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/tokens/typography.css">
<link rel="stylesheet" href="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/tokens/base.css">
<link rel="stylesheet" href="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/styles.css">
<script src="_ds/kortx-design-guide-2026-5bc7ff27-9282-4218-938a-63d43f555d47/_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000509; }
  body { font-family: var(--font-body, Inter, Helvetica, sans-serif); -webkit-font-smoothing: antialiased; }
  a { color: var(--blue-400); text-decoration: none; }
  a:hover { color: var(--blue-300); }
  input, button { font-family: inherit; }
  ::placeholder { color: rgba(255,255,255,.38); }
  [data-focusable]:focus-visible { outline: none; border-color: var(--blue-400) !important; box-shadow: 0 0 0 3px rgba(0,204,255,.55) !important; }
  @keyframes kx-rise { 0% { opacity: 0; transform: translateY(12px) } 100% { opacity: 1; transform: translateY(0) } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  @keyframes kx-orbit { 0% { transform: rotate(0) translateX(26px) } 100% { transform: rotate(360deg) translateX(26px) } }
</style>
</helmet>

<div data-screen-label="Sign Up" style="position: relative; min-height: 100vh; background: #000509; color: #fff; overflow-x: clip; isolation: isolate; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">
    <div style="position: absolute; top: -22vh; right: -14vw; width: 78vw; height: 78vw; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(0,204,255,.16), rgba(0,204,255,.04) 40%, transparent 68%); filter: blur(24px);"></div>
    <div style="position: absolute; bottom: -34vh; left: -18vw; width: 72vw; height: 72vw; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(109,94,240,.14), rgba(109,94,240,.03) 42%, transparent 70%); filter: blur(30px);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: min(130vh, 110vw); aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(255,255,255,.06);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: min(90vh, 80vw); aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(255,255,255,.05);"></div>
  </div>

  <header style="position: relative; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 22px clamp(20px, 4vw, 56px);">
    <a href="/" aria-label="KORTX Creative Labs" style="position: relative; display: grid; place-items: center; width: 46px; height: 46px; flex: none;">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(0,204,255,.24), transparent 68%);"></span>
      <span aria-hidden="true" style="position: absolute; inset: 3px; border: 1px solid rgba(0,204,255,.30); border-radius: 50%;"></span>
      <span aria-hidden="true" style="position: absolute; inset: 8px; border: 1px solid rgba(138,124,248,.28); border-radius: 50%; transform: rotate(18deg) scaleY(.6);"></span>
      <img src="assets/kortx-logomark-bright-blue.svg" alt="KORTX" style="position: relative; width: 20px; display: block;">
      <span aria-hidden="true" style="position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--blue-300, #33D6FF); box-shadow: 0 0 9px rgba(0,204,255,.9); animation: kx-orbit 18s linear infinite;"></span>
    </a>
    <dc-import name="Site Nav" current="sign-up" hint-size="200px,40px"></dc-import>
    <dc-import name="User Menu" current="sign-up" hint-size="40px,40px" style="margin-left: auto; order: 99;"></dc-import>
  </header>

  <main style="position: relative; z-index: 1; flex: 1; width: 100%; box-sizing: border-box; padding: clamp(16px, 4vh, 48px) clamp(20px, 4vw, 56px) 64px; display: flex; align-items: center; justify-content: center;">
    <section data-block="Auth · Sign up card" aria-live="polite" style="width: 100%; max-width: 420px; animation: kx-rise 600ms cubic-bezier(.16,1,.3,1) both;">
      <div style="display: flex; flex-direction: column; gap: 18px; padding: clamp(24px, 3vw, 34px); border-radius: 20px; border: 1px solid rgba(0,204,255,.28); background: #070B15; box-shadow: inset 0 1px 0 rgba(0,204,255,.34), 0 30px 80px rgba(0,0,0,.55), 0 0 80px rgba(0,204,255,.08);">

        <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" style="display: flex; flex-direction: column; gap: 14px;">
            <h1 style="margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -.025em; text-align: center;">Sign Up</h1>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px;">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72);">First name
                <input data-focusable="1" type="text" required="" data-field="first" value="{{ first }}" onChange="{{ onField }}" autocomplete="given-name" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,5,9,.6); color: #fff; font-size: 15px; outline: none;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72);">Last name
                <input data-focusable="1" type="text" required="" data-field="last" value="{{ last }}" onChange="{{ onField }}" autocomplete="family-name" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,5,9,.6); color: #fff; font-size: 15px; outline: none;">
              </label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72);">Email
              <input data-focusable="1" type="email" required="" data-field="email" value="{{ email }}" onChange="{{ onField }}" placeholder="you@kortx.io" autocomplete="email" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,5,9,.6); color: #fff; font-size: 15px; outline: none;">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72);">Password
              <input data-focusable="1" type="password" required="" data-field="password" value="{{ password }}" onChange="{{ onField }}" autocomplete="new-password" placeholder="8+ characters, a letter and a number" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,5,9,.6); color: #fff; font-size: 15px; outline: none;">
            </label>
            <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(248,113,113,.45); background: rgba(248,113,113,.08); font-size: 13px; line-height: 1.45; color: #FECACA;">{{ err }}</div></sc-if>
            <button type="submit" data-focusable="1" disabled="{{ busy }}" style="height: 48px; margin-top: 4px; border-radius: 999px; border: 1px solid transparent; background: var(--blue-400, #00CCFF); color: #001830; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 200ms cubic-bezier(.16,1,.3,1);" style-hover="transform: translateY(-2px); background: var(--blue-300, #66E0FF); box-shadow: 0 0 32px rgba(0,204,255,.45)" style-active="transform: scale(.985)">{{ submitLabel }}</button>
            <div style="text-align: center; font-size: 13px; color: rgba(255,255,255,.66);">Already have an account? <a href="{{ signInHref }}" style="font-weight: 600;">Sign in</a></div>
          </form>
        </sc-if>

        <sc-if value="{{ confirm }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px; text-align: center;">
            <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em;">Check your inbox</h1>
            <p style="margin: 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.72); overflow-wrap: anywhere;">We sent a confirmation link to {{ email }}. Click it to finish and go straight to the Page Builder.</p>
          </div>
        </sc-if>
        <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 14px; text-align: center;">
            <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em;">You're signed in</h1>
            <p style="margin: 0; font-size: 14px; color: rgba(255,255,255,.7); overflow-wrap: anywhere;">{{ userEmail }}</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: start;">
              <a href="{{ builderHref }}" data-focusable="1" style="display: grid; place-items: center; height: 48px; border-radius: 999px; background: var(--blue-400, #00CCFF); color: #001830; font-size: 15px; font-weight: 700; text-decoration: none; transition: all 200ms cubic-bezier(.16,1,.3,1);" style-hover="transform: translateY(-2px); background: var(--blue-300, #66E0FF); color: #001830; box-shadow: 0 0 32px rgba(0,204,255,.45)" style-active="transform: scale(.985)">Page Builder</a>
              <a href="{{ mockHref }}" data-focusable="1" style="display: grid; place-items: center; height: 48px; border-radius: 999px; border: 1px solid rgba(0,204,255,.45); background: rgba(0,204,255,.08); color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; transition: all 200ms cubic-bezier(.16,1,.3,1);" style-hover="transform: translateY(-2px); background: rgba(109,94,240,.16); border-color: rgba(167,139,250,.6); color: #fff; box-shadow: 0 0 32px rgba(109,94,240,.55)" style-active="transform: scale(.985)">Mock Builder</a>
            </div>
            <button type="button" data-focusable="1" onClick="{{ signOut }}" style="height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 200ms cubic-bezier(.16,1,.3,1);" style-hover="transform: translateY(-2px); background: rgba(109,94,240,.16); border-color: rgba(167,139,250,.6); box-shadow: 0 0 32px rgba(109,94,240,.55)">Sign Out</button>
          </div>
        </sc-if>

      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { first: '', last: '', email: '', password: '', err: '', busy: false, user: null, confirm: false };
  async componentDidMount() {
    try {
      this.cloud = await import('./creative-cloud.js');
      if (this.cloud.watchAuth) this.cloud.watchAuth(u => this.setState({ user: u || null }));
      const user = await this.cloud.currentUser();
      /* Landing back from the confirmation email: finish the profile and go to the Builder. */
      if (user && !user.onboarded && user.name) { try { await this.cloud.completeOnboarding({ fullName: user.name, title: user.title || '', phone: user.phone || '' }); } catch (e) {} }
      this.setState({ user });
    } catch (e) {}
  }
  onField = e => this.setState({ [e.currentTarget.dataset.field]: e.currentTarget.value, err: '' });
  friendly(err) { const m = String((err && err.message) || err || ''); if (/already/i.test(m)) return 'That email already has an account. Sign in instead.'; return m || 'Something went wrong. Try again.'; }
  submit = async e => {
    e.preventDefault();
    const s = this.state, email = s.email.trim().toLowerCase(), fullName = [s.first, s.last].map(x => x.trim()).filter(Boolean).join(' ');
    if (!s.first.trim() || !s.last.trim()) return this.setState({ err: 'Add your first and last name.' });
    if (!this.cloud) return this.setState({ err: 'Still loading. Try again in a moment.' });
    if (!this.cloud.isKortxEmail(email)) return this.setState({ err: 'Use your @kortx.io email.' });
    if (!(s.password.length >= 8 && /[a-z]/i.test(s.password) && /\d/.test(s.password))) return this.setState({ err: 'Your password needs 8+ characters, a letter and a number.' });
    this.setState({ busy: true, err: '' });
    try {
      const r = await this.cloud.signUp(email, s.password, { fullName, title: '' });
      if (r === 'confirm') { this.setState({ busy: false, confirm: true, password: '' }); return; }
      try { await this.cloud.completeOnboarding({ fullName, title: '', phone: '' }); } catch (e2) {}
      this.setState({ busy: false, password: '', user: await this.cloud.currentUser() });
    } catch (err) { this.setState({ busy: false, err: this.friendly(err) }); }
  };
  signOut = async () => { if (this.cloud) await this.cloud.signOut(); this.setState({ user: null }); };
  loadUnclaimed() {
    if (!this.cloud || !this.cloud.countUnclaimedBriefs) return;
    this.cloud.countUnclaimedBriefs().then(n => this.setState({ unclaimed: n })).catch(() => this.setState({ unclaimed: null }));
  }
  componentDidUpdate(_, prev) { if (this.state.user && !prev.user) this.loadUnclaimed(); }
  renderVals() {
    const s = this.state, R = this.cloud ? this.cloud.route : (x => x);
    return {
      builderHref: R('/page-builder'), briefsHref: R('/briefs'), mockHref: R('/mock-builder'), buildsHref: R('/my-builds'),
      unclaimedLabel: s.unclaimed == null ? 'Checking briefs…' : s.unclaimed === 0 ? 'No unclaimed briefs' : s.unclaimed + ' unclaimed brief' + (s.unclaimed === 1 ? '' : 's'),
      unclaimedStyle: { display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 10px', borderRadius: 999, fontSize: 12, fontWeight: 700, color: s.unclaimed > 0 ? 'var(--lime-300, #BEF264)' : 'rgba(255,255,255,.6)', background: s.unclaimed > 0 ? 'rgba(190,242,100,.1)' : 'rgba(255,255,255,.04)', border: '1px solid ' + (s.unclaimed > 0 ? 'rgba(190,242,100,.35)' : 'rgba(255,255,255,.1)') },
      showForm: !s.user && !s.confirm, confirm: s.confirm, signedIn: !!s.user && !s.confirm, userEmail: s.user ? s.user.email : '',
      first: s.first, last: s.last, email: s.email, password: s.password, err: s.err, busy: s.busy, submitLabel: s.busy ? 'Creating account…' : 'Create Account',
      onField: this.onField, submit: this.submit, signOut: this.signOut,
      nextHref: R('/page-builder'), signInHref: R('/sign-in')
    };
  }
}
</script>
</body>
</html>
